server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow clothing / model reference photo uploads up to 20MB
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/wasm;

    # Backend REST API (high read-timeout for multimodal VLM & AI try-on generation)
    location ^~ /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # Persisted user uploads & AI-generated try-on previews served from backend volume
    location ^~ /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Cached Alta Daily studio cutouts, self-hosted ONNX models & hashed Vite bundle assets
    location ^~ /alta/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ^~ /models/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ^~ /ort/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Vue Router HTML5 history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
