spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/ai_wardrobe;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-h2.sql
  h2:
    console:
      enabled: false
