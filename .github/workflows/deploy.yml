name: Deploy to Aliyun ECS

# 合并 PR 或直接推送到 main 后自动触发：
# 在 GitHub Actions 构建机完成测试与 Docker 镜像构建（不在 2核2G 服务器上编译，避免 OOM），
# 压缩流式传输至阿里云 ECS 并热更新 8680 端口容器栈。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-aliyun-alta-wardrobe
  cancel-in-progress: false

jobs:
  deploy:
    name: Build Images & Deploy to Aliyun ECS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      REMOTE_DIR: /opt/alta_wardrobe
      APP_PORT: '8680'
      IMAGES: alta-wardrobe-backend:latest alta-wardrobe-web:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Backend Integration & Security Tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B test
        working-directory: backend

      - name: Configure SSH Key
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ECS_HOST}" ] || [ -z "${ECS_SSH_KEY}" ]; then
            echo "::error::Missing GitHub Secrets ECS_HOST or ECS_SSH_KEY"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${ECS_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<'EOF'
          Host *
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          EOF

      - name: Build Production Docker Images on Runner
        run: |
          set -euo pipefail
          docker build -t alta-wardrobe-backend:latest ./backend
          docker build -t alta-wardrobe-web:latest ./frontend
          docker image ls alta-wardrobe-*

      - name: Ensure Remote Directory & Runtime Env
        run: |
          set -euo pipefail
          ssh "${ECS_HOST}" bash -s << 'EOF'
          set -euo pipefail
          mkdir -p /opt/alta_wardrobe/uploads
          if [ ! -f /opt/alta_wardrobe/.env ]; then
            umask 077
            cat > /opt/alta_wardrobe/.env <<ENVEOF
          APP_PORT=8680
          MYSQL_DATABASE=ai_wardrobe
          MYSQL_USER=wardrobe
          MYSQL_PASSWORD=$(openssl rand -hex 16)
          MYSQL_ROOT_PASSWORD=$(openssl rand -hex 18)
          APP_JWT_SECRET=$(openssl rand -hex 32)
          APP_CRYPTO_SECRET=$(openssl rand -hex 24)
          ENVEOF
          fi
          docker image inspect mysql:8.0 >/dev/null 2>&1 || docker pull mysql:8.0
          EOF

      - name: Stream Docker Images to ECS
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          docker save ${IMAGES} | gzip | ssh "${ECS_HOST}" 'set -o pipefail; gunzip | docker load'

      - name: Sync Compose Config & Rolling Update
        run: |
          set -euo pipefail
          scp ./docker-compose.prod.yml "${ECS_HOST}:${REMOTE_DIR}/docker-compose.prod.yml"
          ssh "${ECS_HOST}" bash -s << 'EOF'
          set -euo pipefail
          if docker compose version >/dev/null 2>&1; then dc() { docker compose "$@"; }; else dc() { docker-compose "$@"; }; fi
          cd /opt/alta_wardrobe
          dc -f docker-compose.prod.yml up -d --no-build --remove-orphans
          docker image prune -f
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8680/api/health; then
              echo ""
              ok=1
              break
            fi
            sleep 4
          done
          if [ "$ok" != "1" ]; then
            dc -f docker-compose.prod.yml logs --tail 80 backend mysql web
            exit 1
          fi
          web_code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 8 http://127.0.0.1:8680/)
          if [ "$web_code" != "200" ]; then
            echo "Frontend HTTP check failed with status: $web_code"
            dc -f docker-compose.prod.yml logs --tail 50 web
            exit 1
          fi
          free -m
          df -h / | tail -n 1
          EOF
