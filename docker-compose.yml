services:
  mysql:
    image: mysql:8.0
    container_name: ai-wardrobe-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wardrobe2026}
      MYSQL_DATABASE: ai_wardrobe
      MYSQL_USER: ${MYSQL_USER:-wardrobe}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wardrobe2026}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ai_wardrobe_mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pwardrobe2026"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ai_wardrobe_mysql_data:
